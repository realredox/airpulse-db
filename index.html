<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirPulse - 인천공항 출도착 현황</title>
  <style>
    * { box-sizing: border-box; font-family: 'Malgun Gothic', -apple-system, sans-serif; }
    body { margin: 0; background: #f1f5f9; color: #1e293b; }
    header { background: #00205b; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    header h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; }
    .live-badge { background: #16a34a; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: bold; }
    .sync-box { font-size: 13px; color: #cbd5e1; }
    .panel { background: #fff; margin: 14px auto; max-width: 1540px; padding: 14px 18px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
    .field label { display: block; font-size: 12px; font-weight: bold; color: #475569; margin-bottom: 4px; }
    .field input, .field select { width: 100%; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
    .airline-row { display: flex; gap: 4px; }
    .btn { padding: 7px 12px; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; transition: transform 0.08s ease, filter 0.12s ease; }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: scale(0.95); filter: brightness(0.9); }
    .btn-primary { background: #00205b; color: #fff; }
    .btn-secondary { background: #e2e8f0; color: #1e293b; }
    .btn-success { background: #0d9488; color: #fff; }
    .btn-outline { background: #fff; border: 1px solid #94a3b8; color: #1e293b; padding: 5px 9px; }
    .action-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #e2e8f0; }
    .checks { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; font-weight: bold; }
    .stand-summary { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #cbd5e1; }
    .stand-chip { background: #eff6ff; border: 1px solid #93c5fd; color: #1e3a8a; padding: 4px 10px; border-radius: 16px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .stand-chip:hover { background: #00205b; color: #fff; }
    .table-wrap { max-width: 1540px; margin: 0 auto 30px; background: #fff; border-radius: 10px; overflow-x: auto; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
    th { background: #00205b; color: #fff; padding: 10px 7px; text-align: center; position: sticky; top: 0; z-index: 10; }
    td { padding: 7px 7px; border-bottom: 1px solid #e2e8f0; text-align: center; }
    tr.row-in { background: #f0f9ff; }
    tr.row-out { background: #fffbeb; }
    tr.row-changed { outline: 2px solid #f97316; }
    .badge-chg { background: #f97316; color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 4px; margin-left: 4px; }
    .badge-stand { background: #00205b; color: #fff; padding: 2px 7px; border-radius: 4px; font-weight: bold; cursor: help; display: inline-block; }
    .badge-delay { background: #fee2e2; color: #991b1b; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .badge-done { background: #dcfce7; color: #166534; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    #stand-tooltip { display: none; position: fixed; z-index: 2000; background: #0f172a; color: #fff; padding: 12px; border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); width: 270px; pointer-events: none; }
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1500; }
    .modal { background: #fff; width: 92%; max-width: 520px; max-height: 85vh; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; }
    .al-list { overflow-y: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 12px 0; padding: 6px; border: 1px solid #e2e8f0; border-radius: 6px; }
  </style>
</head>
<body>
<header>
  <h1>✈ AirPulse - 인천공항 출도착 현황 <span class="live-badge">LIVE 30s</span></h1>
  <div class="sync-box" id="sync-status">📡 실시간 서버 연결 중...</div>
</header>

<div class="panel">
  <div class="filter-grid">
    <div class="field" style="min-width:210px;">
      <label>From (시작 날짜·시간)</label>
      <div class="airline-row">
        <input type="date" id="f-from-d" onchange="applyFilters()">
        <select id="f-from-h" style="width:85px;" onchange="applyFilters()"></select>
      </div>
    </div>
    <div class="field" style="min-width:210px;">
      <label>To (종료 날짜·시간)</label>
      <div class="airline-row">
        <input type="date" id="f-to-d" onchange="applyFilters()">
        <select id="f-to-h" style="width:85px;" onchange="applyFilters()"></select>
      </div>
    </div>
    <div class="field">
      <label>항공사 코드</label>
      <div class="airline-row">
        <input type="text" id="f-airline" placeholder="예: KE, OZ" oninput="applyFilters()">
        <button class="btn btn-outline" onclick="openAirlineModal()">☑</button>
      </div>
    </div>
    <div class="field">
      <label>출/도착 구분</label>
      <select id="f-io" onchange="applyFilters()">
        <option value="전체">전체</option>
        <option value="INBOUND">IN/B (도착)</option>
        <option value="OUTBOUND">OUT/B (출발)</option>
      </select>
    </div>
    <div class="field">
      <label>여객/화물</label>
      <select id="f-type" onchange="applyFilters()">
        <option value="전체">전체</option>
        <option value="여객">여객</option>
        <option value="화물">화물</option>
      </select>
    </div>
    <div class="field">
      <label>터미널</label>
      <select id="f-term" onchange="applyFilters()">
        <option value="전체">전체</option>
        <option value="T1">T1</option>
        <option value="T2">T2</option>
        <option value="화물터미널">화물터미널</option>
      </select>
    </div>
  </div>

  <div class="action-bar">
    <div style="display:flex; gap:10px; align-items:end; flex-wrap:wrap;">
      <div class="field" style="width:170px;">
        <label>편명 / 공항</label>
        <input type="text" id="f-kw" placeholder="예: 7C101, LAX" oninput="applyFilters()">
      </div>
      <div class="field" style="width:120px;">
        <label>주기장</label>
        <input type="text" id="f-stand" placeholder="예: 101, 627" oninput="applyFilters()">
      </div>
    </div>

    <div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap;">
      <div class="checks">
        <label><input type="checkbox" id="f-cs" onchange="applyFilters()"> 코드쉐어 포함</label>
        <label style="color:#ea580c;"><input type="checkbox" id="f-changed" onchange="applyFilters()"> 방금변경만</label>
        <label style="color:#2563eb;"><input type="checkbox" id="f-myjob" onchange="applyFilters()"> MY JOB 배정만</label>
        <span id="result-count" style="color:#00205b;">조회: 0편</span>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-secondary" onclick="resetFilters()">🔄 전체 초기화</button>
        <button class="btn btn-success" onclick="downloadCSV()">💾 엑셀(CSV)</button>
      </div>
    </div>
  </div>
  <div class="stand-summary" id="term-summary"></div>
  <div class="stand-summary" id="stand-summary"></div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th><input type="checkbox" id="chk-all" onchange="toggleSelectAll(this.checked)"></th>
        <th>일자</th><th>항공사</th><th>편명</th><th>구분</th><th>유형</th>
        <th>터미널</th><th>주기장</th><th>등록기호</th><th>기종</th><th>출발</th><th>도착</th>
        <th>STD/A</th><th>ETD/A</th><th>ATD/A</th><th>현황</th>
      </tr>
    </thead>
    <tbody id="tbody"><tr><td colspan="16" style="padding:30px;">데이터 수신 중...</td></tr></tbody>
  </table>
</div>

<div id="stand-tooltip"></div>

<div class="modal-bg" id="al-modal">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <strong>항공사 복수 선택</strong>
      <button class="btn btn-outline" onclick="closeAirlineModal()">✕</button>
    </div>
    <div style="margin-top:8px; display:flex; gap:6px;">
      <button class="btn btn-secondary" onclick="toggleAllAirlines(true)">전체 선택</button>
      <button class="btn btn-secondary" onclick="toggleAllAirlines(false)">전체 해제</button>
    </div>
    <div class="al-list" id="al-list"></div>
    <div style="display:flex; justify-content:flex-end; gap:8px;">
      <button class="btn btn-primary" onclick="confirmAirlines()">✔ 선택 완료</button>
      <button class="btn btn-secondary" onclick="closeAirlineModal()">취소</button>
    </div>
  </div>
</div>
<script>
const DB_URL = "https://storage.googleapis.com/airpulse-icn-data-2026/flight_db.json";
const MYJOB_SHEET_CSV_URL = "";

let ALL_RECORDS = [];
let VIEW_RECORDS = [];
let SHEET_JOBS = new Set();
let SELECTED_KEYS = new Set();
let RENDER_LIMIT = 300;

function fmtHHMM(t) {
  const s = String(t || "").trim();
  return s.length >= 5 ? s.slice(0, 5) : (s || "-");
}

function getRowKey(r) {
  const ymd = r["일자코드"] || "";
  const dd = ymd.length >= 8 ? ymd.slice(6, 8) : "00";
  return `${dd}:${r["편명"] || ""}`;
}

async function fetchSheetJobs() {
  if (!MYJOB_SHEET_CSV_URL) return;
  try {
    const res = await fetch(MYJOB_SHEET_CSV_URL + "&t=" + Date.now());
    const text = await res.text();
    const nextSet = new Set();
    text.split(/\r?\n/).slice(1).forEach(line => {
      const cols = line.split(",").map(c => c.replace(/^"|"$/g, "").trim());
      const dateStr = cols.at(0) || "";
      const fltStr = cols.at(1) || "";
      if (dateStr && fltStr) {
        const dd = dateStr.includes("/") ? dateStr.split("/").pop().padStart(2, "0") : dateStr.slice(-2);
        nextSet.add(`${dd}:${fltStr.toUpperCase()}`);
      }
    });
    SHEET_JOBS = nextSet;
  } catch (e) { console.warn("시트 연동 대기:", e); }
}

async function fetchDB(silent = false) {
  await fetchSheetJobs();
  try {
    const res = await fetch(DB_URL + "?t=" + Date.now());
    const data = await res.json();
    ALL_RECORDS = data.records || [];
    ALL_RECORDS.sort((a, b) => {
      const d = (a["일자코드"] || "").localeCompare(b["일자코드"] || "");
      return d !== 0 ? d : (a["STD/A"] || "99:99").localeCompare(b["STD/A"] || "99:99");
    });
    const timePart = (data.updated_at || "").split(" ").pop();
    document.getElementById("sync-status").textContent = `📡 실시간 수집: ${fmtHHMM(timePart)} (30초 자동갱신)`;
    applyFilters();
  } catch (e) {
    if (!silent) document.getElementById("sync-status").textContent = "⚠️ 데이터 수신 지연";
  }
}

function applyFilters() {
  const fFromD = document.getElementById("f-from-d").value;
  const fFromH = document.getElementById("f-from-h").value;
  const fToD = document.getElementById("f-to-d").value;
  const fToH = document.getElementById("f-to-h").value;
  const fAirlines = document.getElementById("f-airline").value.split(",").map(s => s.trim().toUpperCase()).filter(Boolean);
  const fIO = document.getElementById("f-io").value;
  const fType = document.getElementById("f-type").value;
  const fTerm = document.getElementById("f-term").value;
  const fKw = document.getElementById("f-kw").value.trim().toUpperCase();
  const fStand = document.getElementById("f-stand").value.trim().toUpperCase();
  const incCS = document.getElementById("f-cs").checked;
  const onlyChg = document.getElementById("f-changed").checked;
  const onlyMy = document.getElementById("f-myjob").checked;

  VIEW_RECORDS = ALL_RECORDS.filter(r => {
    if (!incCS && r._is_cs) return false;
    if (onlyChg && !r._changed) return false;
    if (onlyMy && !SHEET_JOBS.has(getRowKey(r)) && !SELECTED_KEYS.has(getRowKey(r))) return false;
    if (fAirlines.length && !fAirlines.includes((r["항공사코드"] || "").toUpperCase())) return false;
    if (fIO !== "전체" && r["구분"] !== fIO) return false;
    if (fType !== "전체" && r["여객/화물"] !== fType) return false;
    if (fTerm !== "전체" && r["터미널"] !== fTerm) return false;
    if (fKw && !`${r["편명"]} ${r["출발지"]} ${r["도착지"]}`.toUpperCase().includes(fKw)) return false;
    if (fStand && !(r["주기장"] || "").toUpperCase().includes(fStand)) return false;

    const ymd = r["일자코드"] || "";
    const hh = fmtHHMM(r["STD/A"]).slice(0, 2);
    if (ymd.length === 8 && hh !== "-") {
      const curDH = `${ymd.slice(0, 4)}-${ymd.slice(4, 6)}-${ymd.slice(6, 8)} ${hh}`;
      if (fFromD && curDH < `${fFromD} ${fFromH || "00"}`) return false;
      if (fToD && curDH > `${fToD} ${fToH || "23"}`) return false;
    }
    return true;
  });

  renderStandSummary();
  renderTable(true);
}
function renderStandSummary() {
  const targetList = VIEW_RECORDS.filter(r => SHEET_JOBS.size ? SHEET_JOBS.has(getRowKey(r)) : true);
  const termCounts = { "T1": 0, "T2": 0, "화물터미널": 0 };
  const standCounts = {};

  targetList.forEach(r => {
    const tm = r["터미널"] || "";
    if (termCounts[tm] !== undefined) termCounts[tm]++;
    const st = r["주기장"] || "미배정";
    standCounts[st] = (standCounts[st] || 0) + 1;
  });

  document.getElementById("term-summary").innerHTML = `<strong style="font-size:12px;color:#00205b;">🏢 터미널별 항공편수:</strong>` +
    Object.entries(termCounts).map(([tm, cnt]) => `<span class="stand-chip" onclick="filterByTerm('${tm}')">${tm} (${cnt}편)</span>`).join("");

  const sorted = Object.entries(standCounts).sort((a, b) => b.at(1) - a.at(1)).slice(0, 15);
  document.getElementById("stand-summary").innerHTML = `<strong style="font-size:12px;color:#00205b;">📍 주기장별 항공편수:</strong>` +
    sorted.map(([st, cnt]) => `<span class="stand-chip" onclick="filterByStand('${st === '미배정' ? '' : st}')">${st}번 (${cnt}편)</span>`).join("");
}

function filterByTerm(tm) {
  document.getElementById("f-term").value = tm;
  applyFilters();
}

function filterByStand(st) {
  document.getElementById("f-stand").value = st;
  applyFilters();
}

function resetFilters() {
  ["f-airline","f-kw","f-stand"].forEach(id => document.getElementById(id).value = "");
  ["f-io","f-type","f-term"].forEach(id => document.getElementById(id).value = "전체");
  ["f-cs","f-changed","f-myjob"].forEach(id => document.getElementById(id).checked = false);
  setDefault6Hours();
  applyFilters();
}

function renderTable(resetLimit = true) {
  if (resetLimit) RENDER_LIMIT = 300;
  document.getElementById("result-count").textContent = `조회: ${VIEW_RECORDS.length}편 (선택: ${SELECTED_KEYS.size}편)`;
  const tbody = document.getElementById("tbody");
  if (!VIEW_RECORDS.length) {
    tbody.innerHTML = '<tr><td colspan="16" style="padding:30px;color:#64748b;">조건에 맞는 운항편이 없습니다.</td></tr>';
    return;
  }

  const sliceList = VIEW_RECORDS.slice(0, RENDER_LIMIT);
  const rowsHtml = sliceList.map(r => {
    const rKey = getRowKey(r);
    const isChecked = SELECTED_KEYS.has(rKey) || SHEET_JOBS.has(rKey);
    const isIn = r["구분"] === "INBOUND";
    const rowCls = `${isIn ? "row-in" : "row-out"} ${r._changed ? "row-changed" : ""}`;
    const code = (r["항공사코드"] || "").toUpperCase();
    const st = r["현황"] || "";
    const stBadge = (st.includes("지연") || st.includes("결항")) ? `<span class="badge-delay">${st}</span>`
                  : (st === "출발" || st === "도착") ? `<span class="badge-done">${st}</span>` : st;
    const etaStr = r["ATD/A"] ? "-" : fmtHHMM(r["ETD/A"]);
    const standVal = r["주기장"] || "-";

    return `<tr class="${rowCls}">
      <td><input type="checkbox" ${isChecked ? "checked" : ""} onchange="toggleRow('${rKey}', this.checked)"></td>
      <td>${r["일자"] || "-"}</td>
      <td><strong>${code}</strong> ${r["항공사명"] || ""}</td>
      <td><strong>${r["편명"] || "-"}</strong>${r._changed ? '<span class="badge-chg">변경</span>' : ''}</td>
      <td><strong>${isIn ? "IN/B" : "OUT/B"}</strong></td>
      <td>${r["여객/화물"] || "-"}</td>
      <td>${r["터미널"] || "-"}</td>
      <td><span class="badge-stand" onmouseenter="showStandMap(event,'${standVal}')" onmouseleave="hideStandMap()">${standVal}</span></td>
      <td>${r["등록기호"] || "-"}</td>
      <td>${r["기종"] || "-"}</td>
      <td>${r["출발지"] || "-"}</td>
      <td>${r["도착지"] || "-"}</td>
      <td>${fmtHHMM(r["STD/A"])}</td>
      <td style="color:#0066a6;font-weight:bold;">${etaStr}</td>
      <td style="color:#0d9488;font-weight:bold;">${fmtHHMM(r["ATD/A"])}</td>
      <td>${stBadge || "-"}</td>
    </tr>`;
  }).join("");

  const moreBtn = VIEW_RECORDS.length > RENDER_LIMIT
    ? `<tr><td colspan="16" style="padding:14px;background:#f8fafc;"><button class="btn btn-primary" onclick="RENDER_LIMIT+=300;renderTable(false);">▼ 더 보기 (${RENDER_LIMIT} / ${VIEW_RECORDS.length}편 표시 중)</button></td></tr>`
    : "";

  tbody.innerHTML = rowsHtml + moreBtn;
}
function showStandMap(e, stand) {
  const n = parseInt(String(stand).replace(/\D/g, ""), 10);
  if (!n) return;
  let zone = "제1여객터미널 (T1) 계류장", cx = 130, cy = 78;
  if (n >= 600) { zone = "화물터미널 (Cargo) 계류장"; cx = 215; cy = 85; }
  else if (n >= 200 && n < 300) { zone = "제2여객터미널 (T2) 계류장"; cx = 130; cy = 24; }
  else if (n >= 100 && n < 200) { zone = "탑승동 (Concourse / T1 소속)"; cx = 130; cy = 50; }
  else if (n <= 25) { zone = "T1 동편 계류장 (East)"; cx = 175; cy = 78; }
  else { zone = "T1 서편 계류장 (West)"; cx = 85; cy = 78; }

  const tip = document.getElementById("stand-tooltip");
  tip.innerHTML = `<div style="font-weight:bold;color:#38bdf8;margin-bottom:4px;">📍 ${stand}번 주기장 위치</div>
    <div style="font-size:12px;margin-bottom:8px;">${zone}</div>
    <svg width="246" height="105" style="background:#1e293b;border-radius:6px;">
      <rect x="85" y="16" width="90" height="14" rx="3" fill="#475569"/><text x="130" y="26" fill="#fff" font-size="9" text-anchor="middle">T2</text>
      <rect x="80" y="43" width="100" height="12" rx="3" fill="#475569"/><text x="130" y="52" fill="#fff" font-size="8" text-anchor="middle">탑승동</text>
      <rect x="65" y="70" width="130" height="16" rx="3" fill="#475569"/><text x="130" y="81" fill="#fff" font-size="9" text-anchor="middle">T1</text>
      <rect x="195" y="72" width="42" height="22" rx="3" fill="#475569"/><text x="216" y="86" fill="#fff" font-size="8" text-anchor="middle">화물</text>
      <circle cx="${cx}" cy="${cy}" r="8" fill="#f97316" stroke="#fff" stroke-width="2"/>
    </svg>`;
  tip.style.left = Math.min(window.innerWidth - 285, e.clientX + 14) + "px";
  tip.style.top = Math.min(window.innerHeight - 165, e.clientY + 14) + "px";
  tip.style.display = "block";
}
function hideStandMap() { document.getElementById("stand-tooltip").style.display = "none"; }

function toggleRow(k, chk) {
  if (chk) SELECTED_KEYS.add(k); else { SELECTED_KEYS.delete(k); SHEET_JOBS.delete(k); }
  document.getElementById("result-count").textContent = `조회: ${VIEW_RECORDS.length}편 (선택: ${SELECTED_KEYS.size}편)`;
}
function toggleSelectAll(chk) {
  VIEW_RECORDS.forEach(r => chk ? SELECTED_KEYS.add(getRowKey(r)) : SELECTED_KEYS.delete(getRowKey(r)));
  renderTable(false);
}

function initHourSelects() {
  const opts = ['<option value="">시간</option>'];
  for (let h = 0; h < 24; h++) {
    const hh = String(h).padStart(2, "0");
    opts.push(`<option value="${hh}">${hh}시</option>`);
  }
  document.getElementById("f-from-h").innerHTML = opts.join("");
  document.getElementById("f-to-h").innerHTML = opts.join("");
}

function setDefault6Hours() {
  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  document.getElementById("f-from-d").value = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  document.getElementById("f-from-h").value = pad(now.getHours());
  const end = new Date(now.getTime() + 6 * 60 * 60 * 1000);
  document.getElementById("f-to-d").value = `${end.getFullYear()}-${pad(end.getMonth() + 1)}-${pad(end.getDate())}`;
  document.getElementById("f-to-h").value = pad(end.getHours());
}

function openAirlineModal() {
  const map = new Map();
  ALL_RECORDS.forEach(r => { const c = (r["항공사코드"] || "").toUpperCase(); if (c && !map.has(c)) map.set(c, r["항공사명"] || c); });
  const sel = new Set(document.getElementById("f-airline").value.split(",").map(s => s.trim().toUpperCase()).filter(Boolean));
  document.getElementById("al-list").innerHTML = [...map.entries()].sort((a,b) => a.at(0).localeCompare(b.at(0))).map(([c, n]) =>
    `<label style="font-size:12px;"><input type="checkbox" value="${c}" ${sel.has(c) ? "checked" : ""}> <strong>${c}</strong> (${n})</label>`
  ).join("");
  document.getElementById("al-modal").style.display = "flex";
}
function closeAirlineModal() { document.getElementById("al-modal").style.display = "none"; }
function toggleAllAirlines(f) { document.querySelectorAll("#al-list input").forEach(cb => cb.checked = f); }
function confirmAirlines() {
  document.getElementById("f-airline").value = [...document.querySelectorAll("#al-list input:checked")].map(cb => cb.value).join(", ");
  closeAirlineModal(); applyFilters();
}

function downloadCSV() {
  const cols = ["일자","항공사코드","항공사명","편명","구분","여객/화물","터미널","주기장","등록기호","기종","출발지","도착지","STD/A","ETD/A","ATD/A","현황"];
  const lines = [cols.join(","), ...VIEW_RECORDS.map(r => cols.map(c => `"${String(r[c] || "").replace(/"/g, '""')}"`).join(","))];
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" }));
  a.download = `AirPulse_ICN_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
}

window.addEventListener("DOMContentLoaded", () => {
  initHourSelects();
  setDefault6Hours();
  fetchDB();
  setInterval(() => fetchDB(true), 30000);
});
</script>
