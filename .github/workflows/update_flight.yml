name: AirPulse Auto Fetcher

on:
  schedule:
    # 20분마다 자동 실행 (하루 72회 -> 트래픽 한도 500회 내 안전하게 유지)
    - cron: '*/20 * * * *'
  workflow_dispatch: # GitHub 웹에서 수동으로 즉시 실행 버튼 활성화

permissions:
  contents: write # 수집한 flight_db.json을 저장소에 기록할 권한

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: pip install requests urllib3

      - name: 인천공항 데이터 수집 실행
        env:
          # 비밀 금고의 키를 안전하게 주입
          ICN_API_KEY: ${{ secrets.ICN_API_KEY }}
        run: python fetcher.py

      - name: 수집된 데이터 GitHub에 자동 저장
        run: |
          git config user.name "AirPulse-Bot"
          git config user.email "bot@airpulse.local"
          git add flight_db.json
          git commit -m "Update flight_db.json" || exit 0
          git push
